# Compila el APK de Android en la nube de GitHub (no necesitas Android Studio).
# - En cada push a main: el APK queda en Actions > (ejecución) > Artifacts.
# - Al subir una etiqueta v* (ej. v1.1.0) o al ejecutarlo a mano con "publicar":
#   se crea un Release con el APK listo para descargar en el celular.
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar el APK como Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Usar la URL de la API configurada en el repositorio
        if: ${{ vars.API_URL != '' }}
        run: |
          sed -i "s|apiUrl: '.*'|apiUrl: '${{ vars.API_URL }}'|" src/environments/environment.prod.ts
          cat src/environments/environment.prod.ts

      - name: Compilar la app web (producción)
        run: npx ng build

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Versión
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "nombre=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      # Si existe el secreto KEYSTORE_BASE64 se genera un APK firmado de producción;
      # si no, un APK de depuración (igual se instala en cualquier Android).
      - name: Preparar firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mercado.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/mercado.jks" >> "$GITHUB_ENV"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
          else
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.firma.outputs.tipo }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MercadoCampesino.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/MercadoCampesino.apk"
          fi
          NOMBRE="MercadoCampesino-v${{ steps.version.outputs.nombre }}-${{ github.run_number }}.apk"
          mv "$RUNNER_TEMP/MercadoCampesino.apk" "$GITHUB_WORKSPACE/$NOMBRE"
          echo "APK=$NOMBRE" >> "$GITHUB_ENV"

      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v5
        with:
          name: MercadoCampesino-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build{1}', steps.version.outputs.nombre, github.run_number) }}
          name: Mercado Campesino ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0} (build {1})', steps.version.outputs.nombre, github.run_number) }}
          files: ${{ env.APK }}
          body: |
            APK de Mercado Campesino para Android (${{ steps.firma.outputs.tipo }}).

            **Cómo instalarlo:** descarga el archivo `.apk` desde el celular, ábrelo y,
            si Android lo pide, permite "Instalar apps desconocidas" para tu navegador.
