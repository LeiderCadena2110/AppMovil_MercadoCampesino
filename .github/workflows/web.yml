# Publica la versión web de la app en GitHub Pages:
# https://<usuario>.github.io/AppMovil_MercadoCampesino/
# Requiere una vez: Settings > Pages > Source: "GitHub Actions".
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Usar la URL de la API configurada en el repositorio
        if: ${{ vars.API_URL != '' }}
        run: |
          sed -i "s|apiUrl: '.*'|apiUrl: '${{ vars.API_URL }}'|" src/environments/environment.prod.ts
      - name: Compilar con la ruta del repositorio
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - name: Rutas de Angular en Pages (404 -> index)
        run: cp dist/app/browser/index.html dist/app/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist/app/browser

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
